name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --no-daemon
          fi
          chmod +x gradlew

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Package Kushwanta-v1.0.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Kushwanta-v1.0.apk

      - name: Publish GitHub Release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Kushwanta v1.0
          files: Kushwanta-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
